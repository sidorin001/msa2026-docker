name: Compose acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Service1 formatting
        run: |
          python -m pip install clang-format==18.1.8
          clang-format --version
          clang-format --dry-run --Werror service1/src/*.h service1/src/*.cpp
      - name: Create temporary test configuration
        run: |
          cp .env.example .env
          python - <<'PY'
          import pathlib, secrets
          path = pathlib.Path('.env')
          lines = path.read_text().splitlines()
          path.write_text('\n'.join(line.split('=',1)[0]+'='+secrets.token_hex(24) if '_PASSWORD=' in line else line for line in lines)+'\n')
          PY
      - name: Validate and build
        run: |
          docker version
          docker compose version
          docker compose config --quiet
          docker compose build
          docker compose run --rm --no-deps gateway caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Start seven containers
        run: docker compose up -d --wait --wait-timeout 180
      - name: API and lifecycle acceptance
        run: python tests/integration.py
      - name: Replica balancing and readiness acceptance
        run: python tests/replicas.py
      - name: Install browser test dependencies
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: pgAdmin browser acceptance
        run: python tests/pgadmin_browser.py
      - name: Diagnostics
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 100 service1-v1 service2-v1-a service2-v1-b gateway pgadmin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          if-no-files-found: ignore
      - name: Cleanup disposable test environment
        if: always()
        run: docker compose down -v --remove-orphans
